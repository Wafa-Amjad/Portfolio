<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Rounded Box Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>
  <!-- Subtle Gradient Frame Accent -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#accent-grad)" stroke-width="14" opacity="0.85"/>
  <!-- WA Monogram Initial Text -->
  <text x="256" y="320" font-family="system-ui, -apple-system, 'Playfair Display', 'Georgia', serif" font-size="210" font-weight="900" fill="url(#text-grad)" text-anchor="middle" letter-spacing="-8">WA</text>
  <!-- Bottom Accent Underline Bar -->
  <rect x="156" y="360" width="200" height="14" rx="7" fill="url(#accent-grad)"/>
</svg>
